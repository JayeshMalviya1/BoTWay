name: Botway CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend CI (botway-core) ──────────────────────────────
  backend-ci:
    name: Backend CI (Express + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: botway-core

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: botway-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint Code (ESLint)
        run: npm run lint

      - name: Check Formatting (Prettier)
        run: npm run format:check

      - name: Run Automated Tests & Coverage (Jest)
        env:
          NODE_ENV: test
          PORT: 9999
          FRONTEND_URL: http://localhost:5173
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          RAG_SERVER_URL: http://localhost:8001
        run: npm test

  # ── 2. Frontend CI (React + Vite + TypeScript) ──────────────
  frontend-ci:
    name: Frontend CI (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck & Build (Vite)
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-key
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
